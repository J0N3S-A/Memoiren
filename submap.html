<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unter-Mindmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <div class="logo">
            <button id="backToMainBtn" class="btn-back">
                &larr; Hauptkarte
            </button>
            <span id="parentTitleDisplay" class="parent-title"></span>
        </div>
        <div class="controls">
            <label class="switch-container">
                <span>Verbinden</span>
                <input type="checkbox" id="subConnectSwitch">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <main id="submapNetwork"></main>

    <div class="bubble-basket" id="subBasket" draggable="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>

        <span>Knoten</span>
    </div>

    <div class="modal-overlay" id="subModal">
        <div class="modal-card">
            <div class="modal-header">
                <textarea id="subNodeTitleInput" class="editable-title-multiline" rows="3" placeholder="Mehrzeiliger Titel (max. 3 Zeilen)..."></textarea>
                <button class="close-btn" id="closeSubModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-label">Beschreibung (Dynamische Größe):</div>
                <textarea id="subNodeNoteInput" class="auto-expand-textarea" placeholder="Beschreibung eingeben..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="delete-btn" id="deleteSubNodeBtn">Knoten löschen</button>
            </div>
        </div>
    </div>

    <script type="module" src="submap.js"></script>
</body>
</html>
