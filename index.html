<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Main Mindmap</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css"> <!-- تأكد من ربط ملف الـ CSS الخاص بك هنا -->
    <style>
        /* أنماط أساسية لضمان عمل الواجهة المنبثقة والتبويبات */
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #mindmap { width: 100%; height: 100vh; background: #f8f9fa; }
        .controls { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; gap: 15px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #bubbleBasket { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; background: #2c3e50; color: white; padding: 15px 30px; border-radius: 30px; cursor: pointer; }
        
        /* Modal & Tabs */
        #contentModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; background: white; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-radius: 12px; padding: 25px; }
        #contentModal.active { display: block; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-header input { font-size: 1.5em; border: none; border-bottom: 2px solid #eee; width: 80%; outline: none; }
        .close-btn { cursor: pointer; font-size: 1.5em; background: none; border: none; color: #888; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 8px 12px; cursor: pointer; border: none; background: none; font-size: 1em; color: #555; }
        .tab-btn.active { font-weight: bold; color: #2c3e50; background: #eef2f5; border-radius: 6px; }
        
        .tab-content { display: none; max-height: 350px; overflow-y: auto; }
        .tab-content.active { display: block; }
        
        .item-card { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #fafafa; }
        .item-card input, .item-card textarea { width: 100%; margin-bottom: 10px; border: 1px solid #ddd; padding: 8px; border-radius: 4px; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 1em; }
        .delete-btn { color: #d9534f; background: none; border: none; cursor: pointer; font-size: 0.9em; padding: 0; }
        .delete-element-btn { color: #d9534f; background: none; border: none; cursor: pointer; font-size: 1em; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="controls">
        <label><input type="checkbox" id="physicsSwitch"> <span>Physik (للمرح)</span></label>
        <label><input type="checkbox" id="connectSwitch"> <span>Verbinden (ربط)</span></label>
    </div>

    <div id="mindmap"></div>
    <div id="bubbleBasket">+ Neuer Gedanke</div>

    <div id="contentModal">
        <div class="modal-header">
            <input type="text" id="bubbleTitleInput" placeholder="Titel...">
            <button id="closeContentModal" class="close-btn">&times;</button>
        </div>
        
        <button id="openSubmapBtn" class="btn-primary">🌿 Unter-Mindmap öffnen</button>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-notes">Notizen</button>
            <button class="tab-btn" data-tab="tab-books">Bücher</button>
            <button class="tab-btn" data-tab="tab-audio">Audio</button>
            <button class="tab-btn" data-tab="tab-images">Bilder</button>
        </div>

        <div id="tab-notes" class="tab-content active">
            <div id="quickNotesList"></div>
            <button id="addQuickNoteBtn" style="background:none; border:none; color:#555; cursor:pointer; width:100%; text-align:center; margin-top:10px;">+ Neue Notiz</button>
        </div>
        
        <div id="tab-books" class="tab-content">
            <div id="notebooksList"></div>
            <button id="addNotebookBtn" style="background:none; border:none; color:#555; cursor:pointer; width:100%; text-align:center; margin-top:10px;">+ Neues Buch</button>
        </div>

        <div id="tab-audio" class="tab-content"><p style="text-align:center; color:#888;">Keine Audios (قريباً)</p></div>
        <div id="tab-images" class="tab-content"><p style="text-align:center; color:#888;">Keine Bilder (قريباً)</p></div>

        <button id="deleteBubbleBtn" class="delete-element-btn">Element löschen</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
